[pytest]
# Opt-in suites: pytest -m hardware (resets the board), pytest -m nosd (board booted WITHOUT a card),
# SCENARIO=name pytest -m scenario (really runs that scenario: it drives real devices)
# TUYA_DEVICE=toweldryer pytest -m power_trigger (a real socket: the trigger switches it off, then it is switched on again)
# pytest -m tuya / -m tuya_switch (talk to a real Tuya device, see test_devices.py)
addopts = -ra -m "not hardware and not nosd and not scenario and not tuya and not tuya_switch and not power_trigger"
markers =
    hardware: resets or power-cycles the board; needs SERIAL_PORT or POWER_CMD_OFF/ON
    nosd: expects the board to have been booted without an SD card
    scenario: runs the scenario named in SCENARIO on the device (switches real sockets)
    tuya: queries a real Tuya device (read only); needs TUYA_DEVICE=<name from /devices.json>
    power_trigger: runs power triggers on a real socket (TUYA_DEVICE, e.g. toweldryer); switches it off and on again
    tuya_switch: switches a real Tuya device on and off and restores its state; needs TUYA_DEVICE
