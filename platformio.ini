; ESP32-CAM controller skeleton: web API (config + logs), thread-safe SD logging.
;
; Built and checked against pioarduino (Arduino core 3.3.x). The official
; PlatformIO platform (core 2.x) was NOT tried.

[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32cam
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; min_spiffs.csv = 2 OTA app slots of 1.875 MB each + a 128 KB "spiffs" partition (LittleFS holds only a
; ~1 KB copy of the config). default.csv had 1.25 MB slots and was 90 % full. NVS stays at the same address.
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

; The web UI (web/index.html) and the OpenAPI description (web/openapi.json) are embedded into the firmware: no SD card or flash file needed.
board_build.embed_txtfiles =
    web/index.html
    web/openapi.json

lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    ESP32Async/ESPAsyncWebServer@^3.12.1

; ASYNCWEBSERVER_USE_CHUNK_INFLIGHT=0: with the in-flight credit accounting every RESPONSE_TRY_AGAIN poll
; burns one of 2 credits, so a deferred answer (the Tuya calls take seconds) stalled and the connection
; was closed after 5 s. Without the accounting the deferred chunked response is polled until it is ready.
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DASYNCWEBSERVER_USE_CHUNK_INFLIGHT=0
